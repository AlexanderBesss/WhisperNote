name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # The app is a Windows-only WPF single-file exe; build.ps1 is the same
    # script used locally, so the artifact matches the local publish output.
    # contents: write is scoped to this job (not the workflow) so pull_request
    # runs never get write access from the top-level block; the release steps
    # below are skipped on those runs anyway.
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the release description is built from the
          # commits between the previous release tag and HEAD.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # build.ps1 is the single source of truth: it runs the tests, then
      # publishes, compiling the app exactly once. Any build-setting change
      # (RID, configuration, properties) stays inside the script.
      - name: Build
        shell: pwsh
        run: ./build.ps1

      # On a clean checkout publish\ holds only the freshly built app files:
      # the llama.cpp backends and models are downloaded on first use by the
      # app itself, so they are intentionally not part of the artifact.
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhisperNote-win-x64
          path: publish/
          if-no-files-found: error

      # One release per push to main: the tag is derived from the commit, so
      # every merge adds a new entry to the releases page instead of replacing
      # the previous one. gh is preinstalled on the windows-latest image;
      # GH_TOKEN is the built-in workflow token, made sufficient by the job's
      # contents: write permission.
      - name: Package app for release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath WhisperNote-win-x64.zip -Force

      # The description is the commit list since the previous release tag, so
      # it stays in sync with what actually landed instead of relying on
      # GitHub's generated changelog link.
      - name: Build release notes from the commit list
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          # Newest previous main-* tag that HEAD descends from. Empty for the
          # first release, in which case the whole history is listed.
          $previous = ''
          foreach ($tag in @(git tag --list 'main-*' --sort=-creatordate) | ForEach-Object { $_.Trim() }) {
            if ((git rev-parse ($tag + '^{commit}')).Trim() -eq '${{ github.sha }}') { continue }
            git merge-base --is-ancestor $tag HEAD
            if ($LASTEXITCODE -eq 0) { $previous = $tag; break }
          }

          $range = if ($previous) { "$previous..HEAD" } else { 'HEAD' }
          $commits = @(git log --no-merges --pretty=format:'- %s (%h)' $range)
          Write-Host "Release notes cover $range ($($commits.Count) commit(s))."

          $lines = @(
            "Automatic build of main at ${{ github.sha }}.",
            '',
            '## Changes',
            ''
          ) + $commits + @(
            '',
            '',
            'Models and llama.cpp backends are downloaded by the app on first run.'
          )
          Set-Content -LiteralPath release-notes.md -Value $lines -Encoding UTF8

      - name: Publish release for this commit
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $shortSha = '${{ github.sha }}'.Substring(0, 7)
          $tag = "main-$shortSha"

          # Re-running the same commit must not fail on an existing tag.
          gh release view $tag --json tagName | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Replacing the existing $tag release from a previous run."
            gh release delete $tag --cleanup-tag --yes
          }

          gh release create $tag WhisperNote-win-x64.zip `
            --target ${{ github.sha }} `
            --title "WhisperNote main $shortSha" `
            --notes-file release-notes.md
